          Medida aditiva de abordajes TM/TU/AM de la zona; excluye viajes MR. Unidad: abordajes. Fuente inmediata:
          gold.mart_metroriel_zonas.abordajes_otros_modos. Transformación: Proyección sin cambio de valor.
      - name: abordajes_transmetro
        description: >-
          Medida aditiva de abordajes Transmetro de la zona; unidad: abordajes; no incluye MR. Fuente inmediata:
          gold.mart_metroriel_zonas.abordajes_transmetro. Transformación: Proyección sin cambio de valor.
      - name: abordajes_transurbano
        description: >-
          Medida aditiva de abordajes Transurbano de la zona; unidad: abordajes; no incluye MR. Fuente inmediata:
          gold.mart_metroriel_zonas.abordajes_transurbano. Transformación: Proyección sin cambio de valor.
      - name: abordajes_aerometro
        description: >-
          Medida aditiva de abordajes Aerometro de la zona; unidad: abordajes; no incluye MR. Fuente inmediata:
          gold.mart_metroriel_zonas.abordajes_aerometro. Transformación: Proyección sin cambio de valor.
      - name: viajes_metroriel_iniciados
        data_tests:
          - not_null
        description: >-
          Medida aditiva de viajes MR contados una vez por zona de origen; unidad: viajes iniciados. Fuente inmediata:
          gold.mart_metroriel_zonas.viajes_metroriel_iniciados. Transformación: Proyección sin cambio de valor.
      - name: pct_abordajes_otros_modos_red
        data_tests:
          - not_null
        description: >-
          Porcentaje de abordajes TM/TU/AM de la zona frente a toda la red; unidad: %, no viajes. Fuente inmediata:
          gold.mart_metroriel_zonas.pct_abordajes_otros_modos_red. Transformación: Proyección sin cambio de valor.
      - name: ranking_demanda_otros_modos
        data_tests:
          - not_null
        description: >-
          Ranking no aditivo por abordajes de otros modos frente a todas las áreas, no solo el trazado MR. Fuente
          inmediata: gold.mart_metroriel_zonas.ranking_demanda_otros_modos. Transformación: Proyección sin cambio
          de valor.
      - name: total_abordajes_otros_modos_red
        description: >-
          Medida de denominador global TM/TU/AM, repetida por zona; unidad: abordajes. No aditiva entre filas. Fuente
          inmediata: gold.mart_metroriel_zonas.total_abordajes_otros_modos_red. Transformación: Proyección sin cambio
          de valor.
      - name: areas_en_ranking_red
        description: >-
          Medida de tamaño del universo global; unidad: áreas (16 hoy), no zonas MR. No aditiva entre filas. Fuente
          inmediata: gold.mart_metroriel_zonas.areas_en_ranking_red. Transformación: Proyección sin cambio de valor.
