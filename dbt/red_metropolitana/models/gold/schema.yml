version: 2
models:
  - name: dim_usuario
    description: >-
      Grano: una fila por identidad canónica seudonimizada del puente Silver. Propósito: enlazar eventos del usuario
      sin publicar llaves operacionales. TM/TU/MR se vinculan por patrón numérico inferido, no por identidad personal
      comprobada; Aerómetro queda aislado. No es el padrón activo ni historiza CDC.
    columns:
      - name: usuario_sk
        data_tests:
          - not_null
          - unique
        description: >-
          Clave técnica de usuario seudonimizado, hexadecimal; no es tarjeta ni persona verificada. Fuente inmediata:
          silver.bridge_identidad_usuario.usuario_canonico_id. Transformación: Silver genera USR- con patrón numérico
          TM/TU/MR, AM- con hash aislado o SIN-TARJETA- con md5; macro usuario_sk aplica HMAC-SHA256 con GOLD_PSEUDONYM_KEY
          privada estable y codifica en hex.
      - name: modos_observados
        description: >-
          Medida de cantidad de sistemas distintos presentes en el puente para la identidad; unidad: modos, no viajes.
          Fuente inmediata: silver.bridge_identidad_usuario.sistema_origen. Transformación: COUNT(DISTINCT sistema_origen)
          agrupado por usuario_sk; incluye el universo del puente, no solo viajes MR o abordajes.
      - name: metodo_identidad
        description: >-
          Atributo del método de vinculación: HASH_AISLADO o PATRON_NUMERICO_INFERIDO. Fuente inmediata: silver.bridge_identidad_usuario.metodo_match.
          Transformación: BOOL_OR de metodo_match = HASH_AISLADO por usuario_sk; si es verdadero usa HASH_AISLADO,
          de lo contrario PATRON_NUMERICO_INFERIDO.
  - name: dim_tiempo
    description: >-
      Grano: un timestamp local distinto observado en los eventos Silver, incluidos ingreso y salida MR. Propósito:
      conformar fechas, horas y franjas. No es un calendario continuo; día hábil significa lunes a viernes sin feriados;
      hora pico es una regla analítica local.
    columns:
      - name: tiempo_sk
        data_tests:
          - not_null
          - unique
        description: >-
          Clave técnica entera del instante local, precisión de segundo. Unidad: código YYYYMMDDHHMMSS. Fuente inmediata:
          silver.silver_transmetro_validaciones; silver_transurbano_transacciones; silver_aerometro_boardings; silver_metroriel_viajes
          (fecha_hora; MR fecha_hora_ingreso / fecha_hora_salida). Transformación: Silver: TM convierte a timestamp;
          TU parsea DD/MM/YYYY o YYYY-MM-DD y suma hora; AM convierte UTC a America/Guatemala; MR convierte entry.ts
          / exit.ts a timestamp. Gold no reconvierte el huso horario. UNION de instantes distintos, elimina NULL;
          TO_CHAR(fecha_hora, 'YYYYMMDDHH24MISS')::bigint.
      - name: fecha_hora
        description: >-
          Atributo timestamp de fecha y hora local de Guatemala, sin huso en el tipo SQL. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver_transurbano_transacciones; silver_aerometro_boardings; silver_metroriel_viajes (fecha_hora; MR
          fecha_hora_ingreso / fecha_hora_salida). Transformación: Silver: TM convierte a timestamp; TU parsea DD/MM/YYYY
          o YYYY-MM-DD y suma hora; AM convierte UTC a America/Guatemala; MR convierte entry.ts / exit.ts a timestamp.
          Gold no reconvierte el huso horario. UNION de instantes distintos y exclusión de NULL.
      - name: fecha
        description: >-
          Atributo fecha calendario local. Fuente inmediata: silver.silver_transmetro_validaciones; silver_transurbano_transacciones;
          silver_aerometro_boardings; silver_metroriel_viajes (fecha_hora; MR fecha_hora_ingreso / fecha_hora_salida).
          Transformación: Silver: TM convierte a timestamp; TU parsea DD/MM/YYYY o YYYY-MM-DD y suma hora; AM convierte
          UTC a America/Guatemala; MR convierte entry.ts / exit.ts a timestamp. Gold no reconvierte el huso horario.
          fecha_hora::date.
      - name: anio
        description: >-
          Atributo temporal: año calendario; unidad: componente calendario. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver_transurbano_transacciones; silver_aerometro_boardings; silver_metroriel_viajes (fecha_hora; MR
          fecha_hora_ingreso / fecha_hora_salida). Transformación: Silver: TM convierte a timestamp; TU parsea DD/MM/YYYY
          o YYYY-MM-DD y suma hora; AM convierte UTC a America/Guatemala; MR convierte entry.ts / exit.ts a timestamp.
          Gold no reconvierte el huso horario. EXTRACT(year FROM fecha_hora)::integer.
      - name: mes
        description: >-
          Atributo temporal: mes 1–12; unidad: componente calendario. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver_transurbano_transacciones; silver_aerometro_boardings; silver_metroriel_viajes (fecha_hora; MR
          fecha_hora_ingreso / fecha_hora_salida). Transformación: Silver: TM convierte a timestamp; TU parsea DD/MM/YYYY
          o YYYY-MM-DD y suma hora; AM convierte UTC a America/Guatemala; MR convierte entry.ts / exit.ts a timestamp.
          Gold no reconvierte el huso horario. EXTRACT(month FROM fecha_hora)::integer.
      - name: dia
        description: >-
          Atributo temporal: día del mes 1–31; unidad: componente calendario. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver_transurbano_transacciones; silver_aerometro_boardings; silver_metroriel_viajes (fecha_hora; MR
          fecha_hora_ingreso / fecha_hora_salida). Transformación: Silver: TM convierte a timestamp; TU parsea DD/MM/YYYY
          o YYYY-MM-DD y suma hora; AM convierte UTC a America/Guatemala; MR convierte entry.ts / exit.ts a timestamp.
          Gold no reconvierte el huso horario. EXTRACT(day FROM fecha_hora)::integer.
      - name: dia_semana_iso
        description: >-
          Atributo temporal: día ISO, lunes=1 y domingo=7; unidad: componente calendario. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver_transurbano_transacciones; silver_aerometro_boardings; silver_metroriel_viajes (fecha_hora; MR
          fecha_hora_ingreso / fecha_hora_salida). Transformación: Silver: TM convierte a timestamp; TU parsea DD/MM/YYYY
          o YYYY-MM-DD y suma hora; AM convierte UTC a America/Guatemala; MR convierte entry.ts / exit.ts a timestamp.
          Gold no reconvierte el huso horario. EXTRACT(isodow FROM fecha_hora)::integer.
      - name: hora
        description: >-
          Atributo temporal: hora local 0–23; unidad: componente calendario. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver_transurbano_transacciones; silver_aerometro_boardings; silver_metroriel_viajes (fecha_hora; MR
          fecha_hora_ingreso / fecha_hora_salida). Transformación: Silver: TM convierte a timestamp; TU parsea DD/MM/YYYY
          o YYYY-MM-DD y suma hora; AM convierte UTC a America/Guatemala; MR convierte entry.ts / exit.ts a timestamp.
          Gold no reconvierte el huso horario. EXTRACT(hour FROM fecha_hora)::integer.
      - name: minuto
        description: >-
          Atributo temporal: minuto 0–59; unidad: componente calendario. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver_transurbano_transacciones; silver_aerometro_boardings; silver_metroriel_viajes (fecha_hora; MR
          fecha_hora_ingreso / fecha_hora_salida). Transformación: Silver: TM convierte a timestamp; TU parsea DD/MM/YYYY
          o YYYY-MM-DD y suma hora; AM convierte UTC a America/Guatemala; MR convierte entry.ts / exit.ts a timestamp.
          Gold no reconvierte el huso horario. EXTRACT(minute FROM fecha_hora)::integer.
      - name: segundo
        description: >-
          Atributo temporal: segundo del instante; unidad: componente calendario. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver_transurbano_transacciones; silver_aerometro_boardings; silver_metroriel_viajes (fecha_hora; MR
          fecha_hora_ingreso / fecha_hora_salida). Transformación: Silver: TM convierte a timestamp; TU parsea DD/MM/YYYY
          o YYYY-MM-DD y suma hora; AM convierte UTC a America/Guatemala; MR convierte entry.ts / exit.ts a timestamp.
          Gold no reconvierte el huso horario. EXTRACT(second FROM fecha_hora)::integer.
      - name: es_dia_habil
        description: >-
          Indicador booleano lunes a viernes; no considera feriados. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver_transurbano_transacciones; silver_aerometro_boardings; silver_metroriel_viajes (fecha_hora; MR
          fecha_hora_ingreso / fecha_hora_salida). Transformación: Sobre el instante local: EXTRACT(isodow) BETWEEN
          1 AND 5.
      - name: es_hora_pico
        description: >-
          Indicador booleano de pico local en día hábil: 06:00–08:59 y 17:00–19:59. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver_transurbano_transacciones; silver_aerometro_boardings; silver_metroriel_viajes (fecha_hora; MR
          fecha_hora_ingreso / fecha_hora_salida). Transformación: Día ISO 1–5 AND (hora BETWEEN 6 AND 8 OR hora
          BETWEEN 17 AND 19); regla del proyecto.
  - name: dim_zona
    description: >-
      Grano: una fila por área del universo Silver, 16 actualmente (12 zonas y 4 municipios). Propósito: conservar
      áreas con y sin servicio y oferta de puntos. Universo del generador, no catálogo oficial externo; servicio
      significa presencia en catálogos, no actividad ni capacidad.
    columns:
      - name: zona_sk
        data_tests:
          - not_null
          - unique
        description: >-
          Clave técnica MD5 del nombre del área. Fuente inmediata: silver.silver_universo_zonas.nombre_zona. Transformación:
          MD5(nombre_zona); el nombre del universo se define mediante VALUES en Silver.
      - name: nombre_zona
        description: >-
          Atributo nombre del área: zona capitalina o municipio. Fuente inmediata: silver.silver_universo_zonas.nombre_zona.
          Transformación: Proyección del universo VALUES Silver; no se limita a áreas presentes en catálogos.
      - name: tipo_area
        description: >-
          Atributo categórico zona o municipio. Fuente inmediata: silver.silver_universo_zonas.tipo_area. Transformación:
          Clasificación literal en el universo VALUES de Silver; proyección a Gold.
      - name: modos_con_servicio
        description: >-
          Medida de cantidad de modos con al menos un punto en el área; unidad: modos. Fuente inmediata: silver.silver_universo_zonas.modos_con_servicio.
          Transformación: Silver: COUNT(DISTINCT modo) por zona_conformada desde silver_catalogo_puntos, LEFT JOIN
          al universo y COALESCE a 0; Gold proyecta.
      - name: puntos_transporte
        description: >-
          Medida de puntos de transporte del catálogo de los cuatro modos en el área; unidad: puntos, no capacidad
          ni frecuencia. Fuente inmediata: silver.silver_universo_zonas.puntos_transporte. Transformación: Silver:
          COUNT(*) sin filtro de modo por zona_conformada; normalizar_zona conforma los catálogos, LEFT JOIN al
          universo y COALESCE a 0; Gold proyecta.
      - name: puntos_transmetro
        data_tests:
          - not_null
        description: >-
          Medida de puntos de transporte del catálogo Transmetro en el área; unidad: puntos, no capacidad ni frecuencia.
          Fuente inmediata: silver.silver_universo_zonas.puntos_transmetro. Transformación: Silver: COUNT(*) FILTER
          modo = Transmetro por zona_conformada; normalizar_zona conforma los catálogos, LEFT JOIN al universo y
          COALESCE a 0; Gold proyecta.
      - name: puntos_transurbano
        data_tests:
          - not_null
        description: >-
          Medida de puntos de transporte del catálogo Transurbano en el área; unidad: puntos, no capacidad ni frecuencia.
          Fuente inmediata: silver.silver_universo_zonas.puntos_transurbano. Transformación: Silver: COUNT(*) FILTER
          modo = Transurbano por zona_conformada; normalizar_zona conforma los catálogos, LEFT JOIN al universo
          y COALESCE a 0; Gold proyecta.
      - name: puntos_metroriel
        data_tests:
          - not_null
        description: >-
          Medida de puntos de transporte del catálogo MetroRiel en el área; unidad: puntos, no capacidad ni frecuencia.
          Fuente inmediata: silver.silver_universo_zonas.puntos_metroriel. Transformación: Silver: COUNT(*) FILTER
          modo = MetroRiel por zona_conformada; normalizar_zona conforma los catálogos, LEFT JOIN al universo y
          COALESCE a 0; Gold proyecta.
      - name: puntos_aerometro
        data_tests:
          - not_null
        description: >-
          Medida de puntos de transporte del catálogo Aerometro en el área; unidad: puntos, no capacidad ni frecuencia.
          Fuente inmediata: silver.silver_universo_zonas.puntos_aerometro. Transformación: Silver: COUNT(*) FILTER
          modo = Aerometro por zona_conformada; normalizar_zona conforma los catálogos, LEFT JOIN al universo y
          COALESCE a 0; Gold proyecta.
      - name: tiene_servicio
        description: >-
          Indicador booleano de al menos un modo con punto catalogado; no demuestra demanda. Fuente inmediata: silver.silver_universo_zonas.tiene_servicio.
          Transformación: Silver: COALESCE(modos_con_servicio,0) > 0 tras unión al universo; Gold proyecta.
  - name: dim_punto_transporte
    description: >-
      Grano: una fila por (modo, código de punto) del catálogo Silver. Propósito: conformar estaciones y paradas.
      Punto no es servicio ni zona; coordenadas solo disponibles para Transmetro. La oferta no mide capacidad ni
      accesibilidad.
    columns:
      - name: punto_sk
        data_tests:
          - not_null
          - unique
        description: >-
          Clave técnica del punto, MD5 hexadecimal. Fuente inmediata: silver.silver_catalogo_puntos.modo + codigo_punto.
          Transformación: MD5(modo || ':' || codigo_punto).
      - name: modo_sk
        description: >-
          Clave técnica del modo, referencia lógica a dim_modo. Fuente inmediata: silver.silver_catalogo_puntos.modo.
          Transformación: MD5(modo).
      - name: zona_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_zona'') }}'
                field: zona_sk
        description: >-
          Clave técnica de la zona del punto, referencia lógica a dim_zona. Fuente inmediata: silver.silver_catalogo_puntos.zona_conformada.
          Transformación: Silver normalizar_zona: Z<n>, Zona <n> y district <n> a Zona <n>; demás INITCAP(TRIM),
          vacío/NULL a Desconocida. Gold: MD5(zona_conformada).
      - name: codigo_punto
        description: >-
          Atributo código natural de estación o parada, único dentro de su modo. Fuente inmediata: silver.silver_catalogo_puntos.codigo_punto.
          Transformación: Silver convierte a text y une catálogos con UNION ALL; Gold proyecta.
      - name: nombre_punto
        description: >-
          Atributo nombre o descripción del punto. Fuente inmediata: silver.silver_catalogo_puntos.nombre_punto.
          Transformación: Silver renombra/convierte a text y une catálogos; Gold proyecta.
      - name: modo
        description: >-
          Atributo nombre del sistema del punto. Fuente inmediata: silver.silver_catalogo_puntos.modo. Transformación:
          Literales Transmetro, Transurbano, MetroRiel, Aerometro según rama del catálogo Silver; Gold proyecta.
      - name: zona_conformada
        description: >-
          Atributo área del punto normalizada en Silver. Fuente inmediata: silver.silver_catalogo_puntos.zona_conformada.
          Transformación: normalizar_zona en Silver; Gold proyecta, sin limpiar nuevamente.
      - name: servicio_codigo
        description: >-
          Atributo del servicio del catálogo: línea TM, ruta TU, eje AM o servicio general MR; puede diferir del
          servicio registrado por un evento. Fuente inmediata: silver.silver_catalogo_puntos.servicio_codigo. Transformación:
          Silver convierte a text; para MR define SERVICIO_GENERAL; Gold proyecta.
      - name: latitud
        description: >-
          Atributo coordenada de latitud TM; unidad: grados. NULL en los otros modos. Fuente inmediata: silver.silver_catalogo_puntos.latitud.
          Transformación: Silver NULLIF(lat::text, vacío)::numeric para TM y NULL literal para TU/MR/AM; Gold proyecta.
      - name: longitud
        description: >-
          Atributo coordenada de longitud TM; unidad: grados. NULL en los otros modos. Fuente inmediata: silver.silver_catalogo_puntos.longitud.
          Transformación: Silver NULLIF(lon::text, vacío)::numeric para TM y NULL literal para TU/MR/AM; Gold proyecta.
  - name: dim_modo
    description: >-
      Grano: un modo distinto presente en el catálogo Silver (cuatro actualmente). Propósito: conformar el sistema
      de transporte. Los nombres se asignan por fuente, no por padrón.
    columns:
      - name: modo_sk
        data_tests:
          - not_null
          - unique
        description: >-
          Clave técnica MD5 del modo. Fuente inmediata: silver.silver_catalogo_puntos.modo. Transformación: SELECT
          DISTINCT MD5(modo).
      - name: nombre_modo
        description: >-
          Atributo nombre del sistema: Transmetro, Transurbano, MetroRiel o Aerometro. Fuente inmediata: silver.silver_catalogo_puntos.modo.
          Transformación: Literales de las cuatro ramas del catálogo Silver; SELECT DISTINCT y renombrado en Gold.
  - name: dim_servicio
    description: >-
      Grano: una fila por (modo, código de servicio) observado en operaciones Silver. Propósito: distinguir línea
      TM, ruta TU, eje AM y servicio general MR. No es punto físico; MR no entrega línea y usa un literal. Código
      vacío o NULL se sustituye por SIN_SERVICIO.
    columns:
      - name: servicio_sk
        data_tests:
          - not_null
          - unique
        description: >-
          Clave técnica MD5 del modo y servicio. Fuente inmediata: silver.silver_transmetro_validaciones.linea;
          silver.silver_transurbano_transacciones.ruta; silver.silver_aerometro_boardings.eje; silver.silver_metroriel_viajes
          (existencia). Transformación: MD5(modo || ':' || codigo) después de COALESCE(NULLIF(código,vacío), SIN_SERVICIO);
          MR SERVICIO_GENERAL; UNION de servicios distintos.
      - name: modo_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_modo'') }}'
                field: modo_sk
        description: >-
          Clave técnica de modo, referencia lógica a dim_modo. Fuente inmediata: silver.silver_transmetro_validaciones.linea;
          silver.silver_transurbano_transacciones.ruta; silver.silver_aerometro_boardings.eje; silver.silver_metroriel_viajes
          (existencia). Transformación: MD5(modo) del literal de cada rama operacional.
      - name: modo
        description: >-
          Atributo nombre del sistema que presta el servicio. Fuente inmediata: silver.silver_transmetro_validaciones.linea;
          silver.silver_transurbano_transacciones.ruta; silver.silver_aerometro_boardings.eje; silver.silver_metroriel_viajes
          (existencia). Transformación: Literal por rama TM/TU/AM/MR; UNION de servicios distintos.
      - name: codigo_servicio
        description: >-
          Atributo código de línea, ruta, eje o servicio general. Fuente inmediata: silver.silver_transmetro_validaciones.linea;
          silver.silver_transurbano_transacciones.ruta; silver.silver_aerometro_boardings.eje; silver.silver_metroriel_viajes
          (existencia). Transformación: TM linea, TU ruta, AM eje con COALESCE(NULLIF(código,vacío), SIN_SERVICIO);
          MR literal SERVICIO_GENERAL; UNION distinct.
      - name: tipo_servicio
        description: >-
          Atributo tipo: Línea, Ruta, Eje o Servicio. Fuente inmediata: silver.silver_transmetro_validaciones.linea;
          silver.silver_transurbano_transacciones.ruta; silver.silver_aerometro_boardings.eje; silver.silver_metroriel_viajes
          (existencia). Transformación: Literal Línea/TM, Ruta/TU, Eje/AM o Servicio/MR; no se toma de un campo
          Raw.
  - name: fact_abordajes
    description: >-
      Grano: un evento válido de acceso/abordaje TM, TU o AM proveniente de Silver. Propósito: medir accesos y tarifas
      registradas y enlazar dimensiones. No representa trayecto completo ni usuario distinto; no incluye MetroRiel
      ni destino. Preserva bronze_record_id para auditoría física.
    columns:
      - name: abordaje_sk
        data_tests:
          - not_null
          - unique
        description: >-
          Clave técnica del evento de abordaje, MD5 hexadecimal. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver.silver_transurbano_transacciones; silver.silver_aerometro_boardings.bronze_record_id. Transformación:
          UNION ALL de los tres eventos Silver; MD5(modo || ':' || bronze_record_id).
      - name: usuario_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: '{{ ref(''dim_usuario'') }}'
                field: usuario_sk
        description: >-
          Clave técnica de usuario seudonimizado, referencia lógica a dim_usuario. Fuente inmediata: silver.bridge_identidad_usuario.usuario_canonico_id
          + llaves operacionales. Transformación: JOIN por sistema_origen y tarjeta_id / id_tarjeta / user_hash;
          HMAC-SHA256 del identificador canónico mediante macro usuario_sk.
      - name: tiempo_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_tiempo'') }}'
                field: tiempo_sk
        description: >-
          Clave técnica del instante local del abordaje, referencia lógica a dim_tiempo. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver.silver_transurbano_transacciones; silver.silver_aerometro_boardings.fecha_hora. Transformación:
          TO_CHAR(fecha_hora, 'YYYYMMDDHH24MISS')::bigint después de la normalización temporal Silver; AM UTC a
          Guatemala.
      - name: zona_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_zona'') }}'
                field: zona_sk
        description: >-
          Clave técnica de área del punto de acceso, referencia lógica a dim_zona. Fuente inmediata: silver.silver_catalogo_puntos.zona_conformada
          + código del evento. Transformación: JOIN del catálogo por modo y código de punto; MD5(zona_conformada).
          No se usa zona de residencia.
      - name: punto_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_punto_transporte'') }}'
                field: punto_sk
        description: >-
          Clave técnica del punto de abordaje, referencia lógica a dim_punto_transporte. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver.silver_transurbano_transacciones; silver.silver_aerometro_boardings (estacion_id / cod_parada /
          station_code). Transformación: MD5(modo || ':' || codigo_punto).
      - name: modo_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_modo'') }}'
                field: modo_sk
        description: >-
          Clave técnica de modo, referencia lógica a dim_modo. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver.silver_transurbano_transacciones; silver.silver_aerometro_boardings. Transformación: MD5 del literal
          Transmetro, Transurbano o Aerometro de la rama del UNION ALL.
      - name: servicio_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_servicio'') }}'
                field: servicio_sk
        description: >-
          Clave técnica del servicio registrado por el evento, referencia lógica a dim_servicio. Fuente inmediata:
          silver.silver_transmetro_validaciones; silver.silver_transurbano_transacciones; silver.silver_aerometro_boardings
          (linea / ruta / eje). Transformación: MD5(modo || ':' || COALESCE(NULLIF(servicio_codigo,vacío), SIN_SERVICIO));
          usa operación, no servicio del catálogo.
      - name: fuente_evento
        description: >-
          Atributo de sistema operacional que produjo el abordaje. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver.silver_transurbano_transacciones; silver.silver_aerometro_boardings. Transformación: Literal Transmetro
          / Transurbano / Aerometro por rama del UNION ALL.
      - name: cantidad_abordajes
        description: >-
          Medida aditiva: un abordaje válido por fila; unidad: abordajes. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver.silver_transurbano_transacciones; silver.silver_aerometro_boardings. Transformación: Literal entero
          1 para cada evento Silver válido; SUM mide accesos, no personas ni viajes completos.
      - name: tarifa_quetzales
        description: >-
          Medida aditiva del importe registrado; unidad: GTQ. No garantiza recaudo efectivo. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver.silver_transurbano_transacciones; silver.silver_aerometro_boardings.tarifa_quetzales. Transformación:
          Silver: TM COALESCE(tarifa::numeric,1.00); TU monto_centavos/100.0; AM COALESCE(fare::numeric,3.00). Gold
          proyecta sin recalcular tarifa.
      - name: bronze_record_id
        data_tests:
          - not_null
          - unique
        description: >-
          Identificador técnico de linaje del registro físico Bronze; no es llave personal. Fuente inmediata: silver.silver_transmetro_validaciones;
          silver.silver_transurbano_transacciones; silver.silver_aerometro_boardings.bronze_record_id. Transformación:
          Staging: TM/AM copia _event_id = SHA256(_source_sha256 + dos puntos + _record_number); TU concatena _source_sha256:número
          de registro. Silver y Gold lo conservan sin cambios.
  - name: fact_viajes_metroriel
    description: >-
      Grano: un viaje MetroRiel con estación y timestamp de salida presentes en Silver. Propósito: medir viajes
      completos, tarifa y duración, conservando origen/destino e ingreso/salida. No es un abordaje; en marts cuenta
      una sola vez por origen. Preserva bronze_record_id. El cierre no agrega reglas de validez adicionales a las
      de Silver.
    columns:
      - name: viaje_sk
        data_tests:
          - not_null
          - unique
        description: >-
          Clave técnica MD5 del viaje. Fuente inmediata: silver.silver_metroriel_viajes.bronze_record_id. Transformación:
          MD5('MetroRiel:' || bronze_record_id); Silver exige exit_station y exit_ts no NULL.
      - name: usuario_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_usuario'') }}'
                field: usuario_sk
        description: >-
          Clave técnica de usuario seudonimizado, referencia lógica a dim_usuario. Fuente inmediata: silver.bridge_identidad_usuario.usuario_canonico_id
          + silver_metroriel_viajes.tarjeta_mr. Transformación: JOIN por sistema_origen MetroRiel y llave_origen
          = tarjeta_mr; patrón canónico MR inferido en Silver y HMAC-SHA256 mediante macro usuario_sk.
      - name: tiempo_ingreso_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_tiempo'') }}'
                field: tiempo_sk
        description: >-
          Clave técnica de instante local de ingreso, referencia lógica a dim_tiempo. Fuente inmediata: silver.silver_metroriel_viajes.fecha_hora_ingreso.
          Transformación: Staging aplana JSON; Silver convierte a timestamp; Gold TO_CHAR con YYYYMMDDHH24MISS::bigint;
          no aplica conversión UTC como AM.
      - name: tiempo_salida_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_tiempo'') }}'
                field: tiempo_sk
        description: >-
          Clave técnica de instante local de salida, referencia lógica a dim_tiempo. Fuente inmediata: silver.silver_metroriel_viajes.fecha_hora_salida.
          Transformación: Staging aplana JSON; Silver convierte a timestamp; Gold TO_CHAR con YYYYMMDDHH24MISS::bigint;
          no aplica conversión UTC como AM.
      - name: zona_origen_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_zona'') }}'
                field: zona_sk
        description: >-
          Clave técnica del área de origen, referencia lógica a dim_zona. Fuente inmediata: silver.silver_catalogo_puntos.zona_conformada
          + silver.silver_metroriel_viajes.origen_estacion_id. Transformación: JOIN del catálogo MetroRiel por estación
          origen; zona normalizada en Silver; MD5(zona_conformada).
      - name: punto_origen_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_punto_transporte'') }}'
                field: punto_sk
        description: >-
          Clave técnica de estación de origen, referencia lógica a dim_punto_transporte. Fuente inmediata: silver.silver_metroriel_viajes.origen_estacion_id.
          Transformación: Staging aplana JSON, Silver renombra a text; Gold MD5('MetroRiel:' || estación).
      - name: zona_destino_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_zona'') }}'
                field: zona_sk
        description: >-
          Clave técnica del área de destino, referencia lógica a dim_zona. Fuente inmediata: silver.silver_catalogo_puntos.zona_conformada
          + silver.silver_metroriel_viajes.destino_estacion_id. Transformación: JOIN del catálogo MetroRiel por
          estación destino; zona normalizada en Silver; MD5(zona_conformada).
      - name: punto_destino_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_punto_transporte'') }}'
                field: punto_sk
        description: >-
          Clave técnica de estación de destino, referencia lógica a dim_punto_transporte. Fuente inmediata: silver.silver_metroriel_viajes.destino_estacion_id.
          Transformación: Staging aplana JSON, Silver renombra a text; Gold MD5('MetroRiel:' || estación).
      - name: modo_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_modo'') }}'
                field: modo_sk
        description: >-
          Clave técnica del modo MetroRiel. Fuente inmediata: silver.silver_metroriel_viajes (rama del modelo).
          Transformación: MD5 del literal 'MetroRiel'.
      - name: servicio_sk
        data_tests:
          - relationships:
              arguments:
                to: '{{ ref(''dim_servicio'') }}'
                field: servicio_sk
        description: >-
          Clave técnica del servicio general MetroRiel. Fuente inmediata: silver.silver_metroriel_viajes (existencia
          de viaje). Transformación: MD5 del literal 'MetroRiel:SERVICIO_GENERAL'.
      - name: fuente_evento
        description: >-
          Atributo de sistema operacional: MetroRiel. Fuente inmediata: silver.silver_metroriel_viajes. Transformación:
          Literal 'MetroRiel'.
      - name: cantidad_viajes
        description: >-
          Medida aditiva: un viaje cerrado por fila; unidad: viajes MetroRiel. Fuente inmediata: silver.silver_metroriel_viajes.
          Transformación: Literal entero 1 por fila Silver cerrada; no duplicar por ingreso y salida.
      - name: tarifa_quetzales
        description: >-
          Medida aditiva de importe registrado; unidad: GTQ, no necesariamente recaudo efectivo. Fuente inmediata:
          silver.silver_metroriel_viajes.tarifa_quetzales. Transformación: Staging extrae fare_gtq del JSON; Silver
          convierte a numeric; Gold proyecta.
      - name: duracion_minutos
        description: >-
          Medida de duración registrada del viaje; unidad: minutos. SUM es tiempo acumulado, no tiempo único de
          red. Fuente inmediata: silver.silver_metroriel_viajes.duracion_minutos. Transformación: Silver ROUND(duration_s::numeric
          / 60.0,2); Gold proyecta. No se recalcula restando timestamps.
      - name: bronze_record_id
        data_tests:
          - not_null
          - unique
        description: >-
          Identificador técnico de linaje del registro físico Bronze, no identificador personal. Fuente inmediata:
          silver.silver_metroriel_viajes.bronze_record_id. Transformación: Staging concatena _source_sha256:número
          de registro; Silver y Gold conservan sin cambios; permite buscar raw_json del Parquet batch.
  - name: mart_demanda_hora
    description: >-
      Grano: fecha local × hora × modo × zona (con tipo_evento correspondiente al modo). Propósito: agregar actividad
      y tarifas. TM/TU/AM son abordajes; MR son viajes iniciados una vez por ingreso y zona de origen. cantidad_eventos
      mezcla unidades si se suman tipos; no mide personas ni demanda potencial.
    columns:
      - name: fecha
        data_tests:
          - not_null
        description: >-
          Atributo fecha calendario local. Fuente inmediata: gold.dim_tiempo.fecha. Transformación: JOIN a dim_tiempo
          por tiempo_sk de abordajes o tiempo_ingreso_sk MR; GROUP BY fecha/hora/modo/zona/tipo_evento e indicadores.
      - name: hora
        data_tests:
          - not_null
        description: >-
          Atributo temporal: hora local 0–23; unidad: componente calendario. Fuente inmediata: gold.dim_tiempo.hora.
          Transformación: JOIN a dim_tiempo por tiempo_sk de abordajes o tiempo_ingreso_sk MR; GROUP BY fecha/hora/modo/zona/tipo_evento
          e indicadores.
      - name: es_dia_habil
        description: >-
          Indicador booleano lunes a viernes; no considera feriados. Fuente inmediata: gold.dim_tiempo.es_dia_habil.
          Transformación: JOIN a dim_tiempo por tiempo_sk de abordajes o tiempo_ingreso_sk MR; GROUP BY fecha/hora/modo/zona/tipo_evento
          e indicadores.
      - name: es_hora_pico
        description: >-
          Indicador booleano de pico local en día hábil: 06:00–08:59 y 17:00–19:59. Fuente inmediata: gold.dim_tiempo.es_hora_pico.
          Transformación: JOIN a dim_tiempo por tiempo_sk de abordajes o tiempo_ingreso_sk MR; GROUP BY fecha/hora/modo/zona/tipo_evento
          e indicadores.
      - name: modo
        data_tests:
          - not_null
        description: >-
          Atributo nombre del sistema: Transmetro, Transurbano, MetroRiel o Aerometro. Fuente inmediata: gold.dim_modo.nombre_modo.
          Transformación: Proyección sin cambio de valor.
      - name: zona
        data_tests:
          - not_null
        description: >-
          Atributo nombre de zona del abordaje o del origen MR. Fuente inmediata: gold.dim_zona.nombre_zona + fact_abordajes.zona_sk
          / fact_viajes_metroriel.zona_origen_sk. Transformación: JOIN a dim_zona por zona_sk; MR usa exclusivamente
          zona_origen_sk; GROUP BY zona.
      - name: tipo_evento
        description: >-
          Atributo de unidad: abordaje para TM/TU/AM o viaje para MR. Fuente inmediata: gold.fact_abordajes; gold.fact_viajes_metroriel.
          Transformación: Literales 'abordaje' y 'viaje' en UNION ALL; GROUP BY tipo_evento.
      - name: cantidad_eventos
        data_tests:
          - not_null
        description: >-
          Medida aditiva solo con interpretación por tipo: abordajes o viajes MR iniciados; no usuarios. Fuente
          inmediata: gold.fact_abordajes.cantidad_abordajes; gold.fact_viajes_metroriel.cantidad_viajes. Transformación:
          UNION ALL; SUM(cantidad_eventos) por fecha/hora/modo/zona/tipo. MR usa ingreso/origen y cuenta una vez;
          no sumar unidades heterogéneas para medir viajes.
      - name: tarifa_total_gtq
        description: >-
          Medida aditiva de suma de importes registrados; unidad: GTQ, no recaudo comprobado. Fuente inmediata:
          gold.fact_abordajes.tarifa_quetzales; gold.fact_viajes_metroriel.tarifa_quetzales. Transformación: SUM
          de tarifas Gold por fecha/hora/modo/zona/tipo; hereda TU centavos/100 y valores por defecto TM/AM de Silver.
  - name: mart_cobertura
    description: >-
      Grano: una fila por área de dim_zona (16 hoy), con o sin servicio. Propósito: unir oferta catalogada y actividad
      de todo el período. eventos_totales, ratio global, porcentaje y ranking global mezclan abordajes con viajes
      MR; no son demanda potencial. MR se asigna solo a origen. Zonas sin actividad reciben cero.
    columns:
      - name: zona_sk
        data_tests:
          - not_null
          - unique
        description: >-
          Clave técnica MD5 del nombre del área. Fuente inmediata: gold.dim_zona.zona_sk. Transformación: Proyección
          sin cambio de valor.
      - name: nombre_zona
        data_tests:
          - not_null
          - unique
        description: >-
          Atributo nombre del área: zona capitalina o municipio. Fuente inmediata: gold.dim_zona.nombre_zona. Transformación:
          Proyección sin cambio de valor.
      - name: tipo_area
        description: >-
          Atributo categórico zona o municipio. Fuente inmediata: gold.dim_zona.tipo_area. Transformación: Proyección
          sin cambio de valor.
      - name: modos_con_servicio
        description: >-
          Medida de cantidad de modos con al menos un punto en el área; unidad: modos. Fuente inmediata: gold.dim_zona.modos_con_servicio.
          Transformación: Proyección sin cambio de valor.
      - name: puntos_transporte
        description: >-
          Medida de puntos de transporte del catálogo de los cuatro modos en el área; unidad: puntos, no capacidad
          ni frecuencia. Fuente inmediata: gold.dim_zona.puntos_transporte. Transformación: Proyección sin cambio
          de valor.
      - name: puntos_transmetro
        description: >-
          Medida de puntos de transporte del catálogo Transmetro en el área; unidad: puntos, no capacidad ni frecuencia.
          Fuente inmediata: gold.dim_zona.puntos_transmetro. Transformación: Proyección sin cambio de valor.
      - name: puntos_transurbano
        description: >-
          Medida de puntos de transporte del catálogo Transurbano en el área; unidad: puntos, no capacidad ni frecuencia.
          Fuente inmediata: gold.dim_zona.puntos_transurbano. Transformación: Proyección sin cambio de valor.
      - name: puntos_metroriel
        description: >-
          Medida de puntos de transporte del catálogo MetroRiel en el área; unidad: puntos, no capacidad ni frecuencia.
          Fuente inmediata: gold.dim_zona.puntos_metroriel. Transformación: Proyección sin cambio de valor.
      - name: puntos_aerometro
        description: >-
          Medida de puntos de transporte del catálogo Aerometro en el área; unidad: puntos, no capacidad ni frecuencia.
          Fuente inmediata: gold.dim_zona.puntos_aerometro. Transformación: Proyección sin cambio de valor.
      - name: tiene_servicio
        description: >-
          Indicador booleano de al menos un modo con punto catalogado; no demuestra demanda. Fuente inmediata: gold.dim_zona.tiene_servicio.
          Transformación: Proyección sin cambio de valor.
      - name: eventos_totales
        data_tests:
          - not_null
        description: >-
          Medida de actividad total que mezcla abordajes TM/TU/AM y viajes MR iniciados; no son personas ni viajes
          comparables. Fuente inmediata: gold.mart_demanda_hora.cantidad_eventos. Transformación: SUM(cantidad_eventos)
          por zona; LEFT JOIN por nombre a dim_zona; COALESCE a 0.
      - name: eventos_transmetro
        description: >-
          Medida de abordajes Transmetro por área; unidad: abordajes. Fuente inmediata: gold.mart_demanda_hora.cantidad_eventos
          + modo. Transformación: SUM(cantidad_eventos) FILTER (modo = Transmetro) por zona; LEFT JOIN al universo
          y COALESCE a 0.
      - name: eventos_transurbano
        description: >-
          Medida de abordajes Transurbano por área; unidad: abordajes. Fuente inmediata: gold.mart_demanda_hora.cantidad_eventos
          + modo. Transformación: SUM(cantidad_eventos) FILTER (modo = Transurbano) por zona; LEFT JOIN al universo
          y COALESCE a 0.
      - name: eventos_metroriel
        description: >-
          Medida de viajes iniciados en origen MetroRiel por área; unidad: viajes MR. Fuente inmediata: gold.mart_demanda_hora.cantidad_eventos
          + modo. Transformación: SUM(cantidad_eventos) FILTER (modo = MetroRiel) por zona; LEFT JOIN al universo
          y COALESCE a 0.
      - name: eventos_aerometro
        description: >-
          Medida de abordajes Aerometro por área; unidad: abordajes. Fuente inmediata: gold.mart_demanda_hora.cantidad_eventos
          + modo. Transformación: SUM(cantidad_eventos) FILTER (modo = Aerometro) por zona; LEFT JOIN al universo
          y COALESCE a 0.
      - name: eventos_por_punto
        description: >-
          Razón no aditiva; unidad: actividad mixta por punto de cuatro modos. NULL si no hay puntos; no mide capacidad
          ni frecuencia. Fuente inmediata: gold.mart_demanda_hora + gold.dim_zona. Transformación: ROUND(eventos_totales::numeric
          / NULLIF(puntos_transporte,0),1) después de agregar uso por zona; no promediar razones sin ponderar.
      - name: eventos_por_punto_transmetro
        description: >-
          Razón no aditiva; unidad: abordajes por punto del mismo modo. NULL si no hay puntos; no mide capacidad
          ni frecuencia. Fuente inmediata: gold.mart_demanda_hora + gold.dim_zona. Transformación: ROUND(eventos_transmetro::numeric
          / NULLIF(puntos_transmetro,0),1) después de agregar uso por zona; no promediar razones sin ponderar.
      - name: eventos_por_punto_transurbano
        description: >-
          Razón no aditiva; unidad: abordajes por punto del mismo modo. NULL si no hay puntos; no mide capacidad
          ni frecuencia. Fuente inmediata: gold.mart_demanda_hora + gold.dim_zona. Transformación: ROUND(eventos_transurbano::numeric
          / NULLIF(puntos_transurbano,0),1) después de agregar uso por zona; no promediar razones sin ponderar.
      - name: viajes_por_estacion_metroriel
        description: >-
          Razón no aditiva; unidad: viajes iniciados por estación MR. NULL si no hay puntos; no mide capacidad ni
          frecuencia. Fuente inmediata: gold.mart_demanda_hora + gold.dim_zona. Transformación: ROUND(eventos_metroriel::numeric
          / NULLIF(puntos_metroriel,0),1) después de agregar uso por zona; no promediar razones sin ponderar.
      - name: eventos_por_punto_aerometro
        description: >-
          Razón no aditiva; unidad: abordajes por punto del mismo modo. NULL si no hay puntos; no mide capacidad
          ni frecuencia. Fuente inmediata: gold.mart_demanda_hora + gold.dim_zona. Transformación: ROUND(eventos_aerometro::numeric
          / NULLIF(puntos_aerometro,0),1) después de agregar uso por zona; no promediar razones sin ponderar.
      - name: pct_demanda_red
        description: >-
          Porcentaje no aditivo de actividad mixta sobre toda la red; unidad: %, no demanda potencial. Fuente inmediata:
          gold.mart_demanda_hora.cantidad_eventos + gold.dim_zona. Transformación: ROUND(100.0 * eventos_totales
          / NULLIF(SUM(eventos_totales) OVER (),0),2) entre todas las áreas; NULL si total es cero.
      - name: ranking_demanda
        description: >-
          Ranking no aditivo descendente de actividad mixta en todas las áreas; no ranking de viajes comparables.
          Fuente inmediata: gold.mart_demanda_hora.cantidad_eventos + gold.dim_zona. Transformación: RANK() OVER
          (ORDER BY eventos_totales DESC); empates comparten puesto y dejan saltos.
      - name: inconsistencia_cobertura
        description: >-
          Indicador booleano de desacuerdo entre oferta catalogada y actividad observada; no mide necesidad insatisfecha.
          Fuente inmediata: gold.dim_zona.tiene_servicio + gold.mart_demanda_hora.cantidad_eventos. Transformación:
          (tiene_servicio AND eventos_totales=0) OR (NOT tiene_servicio AND eventos_totales>0).
  - name: mart_metroriel_zonas
    description: >-
      Grano: una fila por área con estaciones MetroRiel, para todo el período Gold (cinco zonas hoy). Propósito:
      contrastar oferta con demanda observada de otros modos. Ranking y participación se calculan sobre todo dim_zona
      (16 áreas) antes de filtrar el trazado. Abordajes y viajes MR iniciados son unidades separadas; demanda observada
      no equivale a potencial ni demuestra período previo a apertura.
    columns:
      - name: zona_sk
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: '{{ ref(''dim_zona'') }}'
                field: zona_sk
        description: >-
          Clave técnica MD5 del nombre del área. Fuente inmediata: gold.dim_zona.zona_sk. Transformación: Proyección
          sin cambio de valor.
      - name: nombre_zona
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values:
                  - Zona 12
                  - Zona 8
                  - Zona 1
                  - Zona 6
                  - Zona 17
        description: >-
          Atributo nombre del área: zona capitalina o municipio. Fuente inmediata: gold.dim_zona.nombre_zona. Transformación:
          Proyección sin cambio de valor.
      - name: estaciones_metroriel
        description: >-
          Medida de oferta catalogada MR; unidad: estaciones, no capacidad. Fuente inmediata: gold.dim_punto_transporte.zona_sk
          + modo. Transformación: COUNT(*) por zona_sk WHERE modo = MetroRiel; JOIN después de calcular ranking
          y denominador en el universo completo.
        data_tests:
          - not_null
      - name: abordajes_otros_modos
        description: >-
          Medida aditiva de abordajes TM/TU/AM de la zona; excluye viajes MR. Unidad: abordajes. Fuente inmediata:
          gold.fact_abordajes.cantidad_abordajes + gold.dim_modo.nombre_modo. Transformación: JOIN a dim_modo; filtra
          Transmetro/Transurbano/Aerometro; SUM por zona_sk y COALESCE a 0 en el universo completo.
        data_tests:
          - not_null
      - name: abordajes_transmetro
        data_tests:
          - not_null
        description: >-
          Medida aditiva de abordajes Transmetro de la zona; unidad: abordajes; no incluye MR. Fuente inmediata:
          gold.fact_abordajes.cantidad_abordajes + gold.dim_modo.nombre_modo. Transformación: SUM(cantidad_abordajes)
          FILTER nombre_modo = Transmetro por zona_sk; COALESCE a 0; forma parte de abordajes_otros_modos.
      - name: abordajes_transurbano
        data_tests:
          - not_null
        description: >-
          Medida aditiva de abordajes Transurbano de la zona; unidad: abordajes; no incluye MR. Fuente inmediata:
          gold.fact_abordajes.cantidad_abordajes + gold.dim_modo.nombre_modo. Transformación: SUM(cantidad_abordajes)
          FILTER nombre_modo = Transurbano por zona_sk; COALESCE a 0; forma parte de abordajes_otros_modos.
      - name: abordajes_aerometro
        data_tests:
          - not_null
        description: >-
          Medida aditiva de abordajes Aerometro de la zona; unidad: abordajes; no incluye MR. Fuente inmediata:
          gold.fact_abordajes.cantidad_abordajes + gold.dim_modo.nombre_modo. Transformación: SUM(cantidad_abordajes)
          FILTER nombre_modo = Aerometro por zona_sk; COALESCE a 0; forma parte de abordajes_otros_modos.
      - name: viajes_metroriel_iniciados
        description: >-
          Medida aditiva de viajes MR contados una vez por zona de origen; unidad: viajes iniciados. Fuente inmediata:
          gold.fact_viajes_metroriel.cantidad_viajes + zona_origen_sk. Transformación: SUM(cantidad_viajes) por
          zona_origen_sk; LEFT JOIN al universo y COALESCE a 0; no cuenta destino.
        data_tests:
          - not_null
      - name: pct_abordajes_otros_modos_red
        description: >-
          Porcentaje de abordajes TM/TU/AM de la zona frente a toda la red; unidad: %, no viajes. Fuente inmediata:
          gold.fact_abordajes + gold.dim_modo + gold.dim_zona. Transformación: ROUND(100.0 * abordajes_otros_modos
          / NULLIF(total_abordajes_otros_modos_red,0),2), COALESCE a 0; denominador global antes de seleccionar
          estaciones MR.
        data_tests:
          - not_null
      - name: ranking_demanda_otros_modos
        description: >-
          Ranking no aditivo por abordajes de otros modos frente a todas las áreas, no solo el trazado MR. Fuente
          inmediata: gold.fact_abordajes + gold.dim_modo + gold.dim_zona. Transformación: RANK() OVER (ORDER BY
          abordajes_otros_modos DESC) entre todas las áreas incluidas las de cero; después selecciona zonas con
          estaciones MR. Empates con saltos.
        data_tests:
          - not_null
      - name: total_abordajes_otros_modos_red
        description: >-
          Medida de denominador global TM/TU/AM, repetida por zona; unidad: abordajes. No aditiva entre filas. Fuente
          inmediata: gold.fact_abordajes + gold.dim_modo + gold.dim_zona. Transformación: SUM(abordajes_otros_modos)
          OVER () sobre todo dim_zona antes de filtrar estaciones MR; usar MIN/MAX para mostrar el valor, no SUM.
        data_tests:
          - not_null
      - name: areas_en_ranking_red
        description: >-
          Medida de tamaño del universo global; unidad: áreas (16 hoy), no zonas MR. No aditiva entre filas. Fuente
          inmediata: gold.dim_zona. Transformación: COUNT(*) OVER () sobre todas las áreas antes de seleccionar
          estaciones MR; denominador contextual repetido por fila.
        data_tests:
          - not_null
  - name: v_tableau_demanda_abordajes
    description: >-
      Grano: fecha local × hora × modo × zona, heredado del mart filtrado a tipo_evento = abordaje. Propósito: exponer
      abordajes TM/TU/AM a Tableau con unidad explícita. No mide personas ni demanda potencial; tarifa es importe
      registrado. Fuera de pico incluye fines de semana.
    columns:
      - name: fecha
        description: >-
          Atributo fecha calendario local. Fuente inmediata: gold.mart_demanda_hora.fecha. Transformación: Proyección
          del mart WHERE tipo_evento = abordaje; no cambia calendario ni hora local.
      - name: hora
        description: >-
          Atributo temporal: hora local 0–23; unidad: componente calendario. Fuente inmediata: gold.mart_demanda_hora.hora.
          Transformación: Proyección del mart WHERE tipo_evento = abordaje; no cambia calendario ni hora local.
      - name: es_dia_habil
        description: >-
          Indicador booleano lunes a viernes; no considera feriados. Fuente inmediata: gold.mart_demanda_hora.es_dia_habil.
          Transformación: Proyección del mart WHERE tipo_evento = abordaje; no cambia calendario ni hora local.
      - name: es_hora_pico
        description: >-
          Indicador booleano de pico local en día hábil: 06:00–08:59 y 17:00–19:59. Fuente inmediata: gold.mart_demanda_hora.es_hora_pico.
          Transformación: Proyección del mart WHERE tipo_evento = abordaje; no cambia calendario ni hora local.
      - name: franja
        description: >-
          Atributo de franja: Hora pico o Fuera de pico; incluye fines de semana fuera de pico. Fuente inmediata:
          gold.mart_demanda_hora.es_hora_pico. Transformación: CASE WHEN es_hora_pico THEN 'Hora pico' ELSE 'Fuera
          de pico' END; filtro por tipo_evento.
      - name: modo
        description: >-
          Atributo nombre del sistema: Transmetro, Transurbano, MetroRiel o Aerometro. Fuente inmediata: gold.mart_demanda_hora.modo.
          Transformación: Proyección y filtro WHERE tipo_evento = abordaje; conserva agregación fecha/hora/modo/zona.
      - name: zona
        description: >-
          Atributo nombre de zona del abordaje o del origen MR. Fuente inmediata: gold.mart_demanda_hora.zona. Transformación:
          Proyección y filtro WHERE tipo_evento = abordaje; conserva agregación fecha/hora/modo/zona.
      - name: tarifa_total_gtq
        description: >-
          Medida aditiva de suma de importes registrados; unidad: GTQ, no recaudo comprobado. Fuente inmediata:
          gold.mart_demanda_hora.tarifa_total_gtq. Transformación: Proyección y filtro WHERE tipo_evento = abordaje;
          conserva agregación fecha/hora/modo/zona.
      - name: cantidad_abordajes
        description: >-
          Medida aditiva de abordajes TM/TU/AM; unidad: abordajes. Fuente inmediata: gold.mart_demanda_hora.cantidad_eventos.
          Transformación: Renombra cantidad_eventos tras WHERE tipo_evento = abordaje; no suma unidades distintas.
  - name: v_tableau_demanda_viajes_mr
