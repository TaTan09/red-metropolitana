      - name: tarifa_total_gtq
        description: >-
          Medida aditiva de suma de importes registrados; unidad: GTQ, no recaudo comprobado. Fuente inmediata:
          gold.mart_demanda_hora.tarifa_total_gtq. Transformación: Proyección y filtro WHERE tipo_evento = viaje;
          conserva agregación fecha/hora/modo/zona.
      - name: zona_origen
        description: >-
          Atributo nombre de zona del abordaje o del origen MR. Fuente inmediata: gold.mart_demanda_hora.zona. Transformación:
          Proyección y filtro WHERE tipo_evento = viaje; conserva agregación fecha/hora/modo/zona.
      - name: viajes_iniciados
        description: >-
          Medida aditiva de viajes MetroRiel iniciados en origen; unidad: viajes MR. Fuente inmediata: gold.mart_demanda_hora.cantidad_eventos.
          Transformación: Renombra cantidad_eventos tras WHERE tipo_evento = viaje; no suma unidades distintas.
  - name: v_tableau_cobertura
    description: >-
      Grano: una fila por área de la red (16 hoy). Propósito: exponer oferta, abordajes TM/TU/AM y viajes MR iniciados
      a Tableau con unidades separadas. Servicio deriva de catálogos, no de actividad; cero observado no implica
      ausencia de demanda potencial. Los rankings se calculan en toda la vista y no se recalculan con filtros posteriores
      de Tableau.
    columns:
      - name: nombre_zona
        description: >-
          Atributo nombre del área: zona capitalina o municipio. Fuente inmediata: gold.mart_cobertura.nombre_zona.
          Transformación: Proyección sin cambio de valor.
      - name: tipo_area
        description: >-
          Atributo categórico zona o municipio. Fuente inmediata: gold.mart_cobertura.tipo_area. Transformación:
          Proyección sin cambio de valor.
      - name: tiene_servicio
        description: >-
          Indicador booleano de al menos un modo con punto catalogado; no demuestra demanda. Fuente inmediata: gold.mart_cobertura.tiene_servicio.
          Transformación: Proyección sin cambio de valor.
      - name: modos_con_servicio
        description: >-
          Medida de cantidad de modos con al menos un punto en el área; unidad: modos. Fuente inmediata: gold.mart_cobertura.modos_con_servicio.
          Transformación: Proyección sin cambio de valor.
      - name: puntos_transporte
        description: >-
          Medida de puntos de transporte del catálogo de los cuatro modos en el área; unidad: puntos, no capacidad
          ni frecuencia. Fuente inmediata: gold.mart_cobertura.puntos_transporte. Transformación: Proyección sin
          cambio de valor.
      - name: puntos_transmetro
        description: >-
          Medida de puntos de transporte del catálogo Transmetro en el área; unidad: puntos, no capacidad ni frecuencia.
          Fuente inmediata: gold.mart_cobertura.puntos_transmetro. Transformación: Proyección sin cambio de valor.
      - name: puntos_transurbano
        description: >-
          Medida de puntos de transporte del catálogo Transurbano en el área; unidad: puntos, no capacidad ni frecuencia.
          Fuente inmediata: gold.mart_cobertura.puntos_transurbano. Transformación: Proyección sin cambio de valor.
      - name: puntos_metroriel
        description: >-
          Medida de puntos de transporte del catálogo MetroRiel en el área; unidad: puntos, no capacidad ni frecuencia.
          Fuente inmediata: gold.mart_cobertura.puntos_metroriel. Transformación: Proyección sin cambio de valor.
      - name: puntos_aerometro
        description: >-
          Medida de puntos de transporte del catálogo Aerometro en el área; unidad: puntos, no capacidad ni frecuencia.
          Fuente inmediata: gold.mart_cobertura.puntos_aerometro. Transformación: Proyección sin cambio de valor.
      - name: abordajes
        description: >-
          Medida aditiva de abordajes TM/TU/AM del área; unidad: abordajes; excluye MR. Fuente inmediata: gold.mart_cobertura.eventos_transmetro
          + eventos_transurbano + eventos_aerometro. Transformación: Suma de los tres desgloses del mart; excluye
          eventos_metroriel.
      - name: abordajes_transmetro
        description: >-
          Medida de abordajes Transmetro por área; unidad: abordajes. Fuente inmediata: gold.mart_cobertura.eventos_transmetro.
          Transformación: Proyección con renombrado para explicitar unidad; sin cambio de valor.
      - name: abordajes_transurbano
        description: >-
          Medida de abordajes Transurbano por área; unidad: abordajes. Fuente inmediata: gold.mart_cobertura.eventos_transurbano.
          Transformación: Proyección con renombrado para explicitar unidad; sin cambio de valor.
      - name: abordajes_aerometro
        description: >-
          Medida de abordajes Aerometro por área; unidad: abordajes. Fuente inmediata: gold.mart_cobertura.eventos_aerometro.
          Transformación: Proyección con renombrado para explicitar unidad; sin cambio de valor.
      - name: viajes_mr_iniciados
        description: >-
          Medida de viajes iniciados en origen MetroRiel por área; unidad: viajes MR. Fuente inmediata: gold.mart_cobertura.eventos_metroriel.
          Transformación: Proyección con renombrado para explicitar unidad; sin cambio de valor.
      - name: eventos_por_punto_transmetro
        description: >-
          Razón no aditiva; unidad: abordajes por punto del mismo modo. NULL si no hay puntos; no mide capacidad
          ni frecuencia. Fuente inmediata: gold.mart_cobertura.eventos_por_punto_transmetro. Transformación: Proyección
          sin cambio de valor.
      - name: eventos_por_punto_transurbano
        description: >-
          Razón no aditiva; unidad: abordajes por punto del mismo modo. NULL si no hay puntos; no mide capacidad
          ni frecuencia. Fuente inmediata: gold.mart_cobertura.eventos_por_punto_transurbano. Transformación: Proyección
          sin cambio de valor.
      - name: eventos_por_punto_aerometro
        description: >-
          Razón no aditiva; unidad: abordajes por punto del mismo modo. NULL si no hay puntos; no mide capacidad
          ni frecuencia. Fuente inmediata: gold.mart_cobertura.eventos_por_punto_aerometro. Transformación: Proyección
          sin cambio de valor.
      - name: viajes_por_estacion_metroriel
        description: >-
          Razón no aditiva; unidad: viajes iniciados por estación MR. NULL si no hay puntos; no mide capacidad ni
          frecuencia. Fuente inmediata: gold.mart_cobertura.viajes_por_estacion_metroriel. Transformación: Proyección
          sin cambio de valor.
      - name: pct_abordajes_red
        description: >-
          Porcentaje no aditivo de abordajes del área en toda la red; unidad: %, excluye MR. Fuente inmediata: gold.mart_cobertura.eventos_transmetro
          / eventos_transurbano / eventos_aerometro. Transformación: ROUND(100.0 * abordajes / NULLIF(SUM(abordajes)
          OVER (),0),2) sobre todas las áreas; NULL si denominador es cero.
      - name: ranking_abordajes
        description: >-
          Ranking no aditivo descendente de abordajes TM/TU/AM entre todas las áreas. Fuente inmediata: gold.mart_cobertura.eventos_transmetro
          / eventos_transurbano / eventos_aerometro. Transformación: RANK() OVER (ORDER BY abordajes DESC); empates
          comparten puesto con saltos; incluye áreas sin abordajes.
      - name: ranking_viajes_mr_origen
        description: >-
          Ranking no aditivo descendente por viajes MR iniciados en origen entre todas las áreas. Fuente inmediata:
          gold.mart_cobertura.eventos_metroriel. Transformación: RANK() OVER (ORDER BY viajes_mr_iniciados DESC);
          empates con saltos. No mide destinos ni demanda comparable a otros modos.
  - name: v_tableau_metroriel
    description: >-
      Grano: una fila por zona con estaciones MetroRiel (cinco hoy), para todo el período. Propósito: consumo Tableau
      del caso MR. Separa abordajes de otros modos y viajes iniciados MR, conserva ranking entre 16 áreas y denominador
      global. No demuestra demanda potencial ni previa temporalmente; ranking, universo y total repetido no se suman
      ni se recalculan con filtros de la vista.
