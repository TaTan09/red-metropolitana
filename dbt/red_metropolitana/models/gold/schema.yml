      - name: nombre_zona
        data_tests:
          - not_null
          - unique
        description: >-
          Atributo nombre del área: zona capitalina o municipio. Fuente inmediata: gold.mart_metroriel_zonas.nombre_zona.
          Transformación: Proyección sin cambio de valor.
