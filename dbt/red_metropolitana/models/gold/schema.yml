          Transformación: Proyección del mart WHERE tipo_evento = viaje; no cambia calendario ni hora local.
      - name: franja
        description: >-
          Atributo de franja: Hora pico o Fuera de pico; incluye fines de semana fuera de pico. Fuente inmediata:
          gold.mart_demanda_hora.es_hora_pico. Transformación: CASE WHEN es_hora_pico THEN 'Hora pico' ELSE 'Fuera
