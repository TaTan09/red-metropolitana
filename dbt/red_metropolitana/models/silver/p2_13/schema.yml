      - name: unidad_id
        data_tests: [not_null]
      - name: fecha_corte
        data_tests: [not_null]
      - name: viajes_28d
        data_tests: [not_null]
      - name: gasto_28d_gtq
        data_tests: [not_null]
      - name: etiqueta
        data_tests:
          - accepted_values:
              values: [0, 1]
              quote: false
