version: 2
models:
  - name: silver_p2_usos_tarjeta
    description: Usos Silver no cuarentenados; un viaje MR cerrado cuenta una vez por ingreso y se conoce al cerrar.
    columns:
      - name: operador
        data_tests:
          - not_null
          - accepted_values:
              values: ['Transmetro', 'Transurbano', 'MetroRiel', 'Aerometro']
      - name: llave_operacional
        data_tests: [not_null]
      - name: evento_id
        data_tests: [not_null]
      - name: fecha_uso
        data_tests: [not_null]
      - name: disponible_desde
        data_tests: [not_null]
  - name: silver_p2_poblacion_tarjeta
    description: Población por tarjeta y corte A/B/C; etiqueta oculta en C. No es PERSONA.
    columns:
      - name: unidad_id
        description: MD5 de operador:llave_operacional; namespace operacional, independiente de fecha y de usuario canónico.
        data_tests: [not_null]
      - name: operador
        data_tests: [not_null]
      - name: llave_operacional
        data_tests: [not_null]
      - name: fecha_corte
        data_tests: [not_null]
      - name: corte
        data_tests:
          - not_null
          - accepted_values:
              values: ['A', 'B', 'C']
      - name: etiqueta
        data_tests:
          - accepted_values:
              values: [0, 1]
              quote: false
  - name: silver_p2_costo_tarjeta
    description: Resumen A/B; costo observable por patrón numérico inferido P1, sin equivalencias de Aerómetro ni decisiones de modelado.
    columns:
      - name: corte
        data_tests: [not_null, unique]
      - name: poblacion
        data_tests: [not_null]
      - name: positivos
        data_tests: [not_null]
      - name: positivos_con_actividad_otro_operador
        data_tests: [not_null]
